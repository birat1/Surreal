image: python:3.12

stages:
  - test
  - build

cache:
  paths:
    - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  # Mock Environment Variables for CI
  DATABASE_URL: "mongodb://mongo:27017/testdb"
  JWT_SECRET: "ci_test_secret"
  JWT_ALGORITHM: "HS256"
  USER_AUTH_SERVICE_URL: "http://mock-auth"

test_messaging:
  stage: test
  services:
    - name: mongo:latest
      alias: mongo
  variables:
    PYTHONUNBUFFERED: "1"
  script:
    - cd messaging-service
    - pip install -r requirements.txt
    - apt-get update && apt-get install -y netcat-openbsd
    - while ! nc -z mongo 27017; do sleep 1; done
    - python -m pytest

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - cd messaging-service
    - docker build -t "$CI_REGISTRY_IMAGE/messaging-service:latest" .
    - docker push "$CI_REGISTRY_IMAGE/messaging-service:latest"
  only:
    - main
