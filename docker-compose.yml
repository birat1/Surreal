services:
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass 
      POSTGRES_DB: messagedb
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"

  messaging-service:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data: