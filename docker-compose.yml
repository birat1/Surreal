services:
    frontend-dev:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: frontend-dev
        ports:
            - '5173:5173'
        volumes:
            - .:/app
            - /app/node_modules
        networks:
            - backend
        environment:
            - VITE_AUTH_TARGET=http://host.docker.internal:8002

networks:
    backend:
        external: true
