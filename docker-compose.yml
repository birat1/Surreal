services:
  db:
    image: mongo:latest
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: pass 
      MONGO_INITDB_DATABASE: messagedb
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  messaging-service:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
    volumes:
      - .:/app
    restart: on-failure

volumes:
  mongo_data: