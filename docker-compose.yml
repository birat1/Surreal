services:
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass 
      POSTGRES_DB: messagedb
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"

  messaging-service:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
    volumes:
      - .:/app
    restart: on-failure
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0 --port 8000 --reload"

volumes:
  postgres_data: