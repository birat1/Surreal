services:
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: eventsandsocietiesdb
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      - events-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d eventsandsocietiesdb"]
      interval: 1s
      timeout: 10s
      retries: 10

  events-and-societies-service:
    build: .
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - events-internal
      - backend

networks:
  events-internal:
    driver: bridge
  backend:
    external: true

volumes:
  postgres_data:
