worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    map $http_origin $cors_origin {
        default "";
        "http://localhost:5173" $http_origin;
        "http://127.0.0.1:5173" $http_origin;
        "http://localhost:8080" $http_origin;
        "http://127.0.0.1:8080" $http_origin;
    }

    server_tokens off;
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for" $request_time $upstream_response_time';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;

    client_max_body_size 5M;

    server {
        listen 0.0.0.0:8080;
        server_name localhost;

        # Frontend Proxy
        location / {
            proxy_pass http://frontend-dev:5173/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location = /internal/validate-token {
            internal;

            proxy_pass http://user-auth-service:8000/validate-token;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        location /auth/send-verification-code {
            proxy_pass http://user-auth-service:8000/send-verification-code;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        location /auth/verify-code {
            proxy_pass http://user-auth-service:8000/verify-code;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        location /auth/login {
            proxy_pass http://user-auth-service:8000/login;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        # Auth Service Proxy
        location ^~ /auth/ {
            if ($request_method = OPTIONS) {
                include /etc/nginx/snippets/cors_preflight.conf;
                return 204;
            }

            auth_request /internal/validate-token;

            proxy_pass http://user-auth-service:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        # Events and Societies Service Proxy
        location /events-and-societies/ {
            if ($request_method = OPTIONS) {
                include /etc/nginx/snippets/cors_preflight.conf;
                return 204;
            }

            auth_request /internal/validate-token;

            proxy_pass http://events-and-societies-service:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        # Notification Service Proxy
        location /notification/ {
            if ($request_method = OPTIONS) {
                include /etc/nginx/snippets/cors_preflight.conf;
                return 204;
            }

            auth_request /internal/validate-token;

            proxy_pass http://notification-service:8080/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;

            proxy_buffering off;
            proxy_cache off;
            
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            chunked_transfer_encoding on;
            tcp_nodelay on;
        }

        # Messaging Service Proxy (WebSockets)
        location /messaging/ {
            if ($request_method = OPTIONS) {
                include /etc/nginx/snippets/cors_preflight.conf;
                return 204;
            }

            auth_request /internal/validate-token;

            proxy_pass http://messaging-service:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
            proxy_buffering off;
        }
    }
}